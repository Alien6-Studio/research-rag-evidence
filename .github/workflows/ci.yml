name: Research CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Research checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the pinned research environment
        run: python -m pip install -r requirements-lock.txt
      - name: Test isolated reproduction and layout controls
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify all relocated evidence and registration proofs
        run: python reproduce.py check
      - name: Reproduce every archived scientific result without model calls
        run: python reproduce.py verify --output .cache/ci-replay
      - name: Retain scientific replay evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scientific-replay-${{ github.sha }}
          path: .cache/ci-replay/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
