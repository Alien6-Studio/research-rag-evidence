name: Research CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Research checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the pinned research environment
        run: python -m pip install -r requirements-lock.txt
      - name: Verify pinned public inputs
        run: python prepare_data.py
      - name: Restore and verify complete V2 evidence
        run: python -m v2.archive restore
      - name: Run research controls
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Recompute all V2 contexts, responses and statistical families offline
        run: python -m v2.verify --output v2/verification.json
      - name: Audit the original experiment and gold-evidence controls
        run: python -m v2.audit --check
      - name: Recheck every archived primary record
        run: python validation/audit_records.py
      - name: Reproduce the exploratory diagnostics from public cached vectors
        run: python extensions/deeper_analysis.py --check
      - name: Verify article source ledger from the archived analyses
        run: python -m v2.article_evidence --check
      - name: Verify published evidence identity
        run: python scripts/verify_evidence.py
      - name: Retain scientific replay evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scientific-replay-${{ github.sha }}
          path: |
            v2/verification.json
            v2/semantic-status.json
          if-no-files-found: warn
          retention-days: 90
